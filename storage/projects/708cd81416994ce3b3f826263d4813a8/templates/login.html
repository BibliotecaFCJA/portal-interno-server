{% extends "base.html" %}
{% block titulo %}Entrar{% endblock %}
{% block conteudo_login %}
<div class="caixa-login">
  <div class="caixa-login-cabecalho">
    <img src="{{ url_for('static', filename='img/logo.jpeg') }}"
         alt="Logo da Fundação Casa de José Américo" class="login-logo">
    <h1>{{ app_nome }}</h1>
    <p class="texto-suave">{{ app_subtitulo }}</p>
  </div>
  <form method="post" action="{{ url_for('auth.login') }}"
        class="formulario formulario-login">
    <div class="campo">
      <label for="email">E-mail ou usuário</label>
      <input type="email" id="email" name="email" required
             autocomplete="username" autofocus>
    </div>
    <div class="campo">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" required
             autocomplete="current-password">
    </div>
    <button type="submit" class="botao botao-primario botao-largo">Entrar</button>
  </form>
  <p class="login-rodape texto-suave">
    {{ instituicao }} — acesso restrito à equipe de digitalização.
  </p>
</div>
{% endblock %}
