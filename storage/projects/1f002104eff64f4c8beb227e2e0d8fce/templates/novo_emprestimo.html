{% extends "base_admin.html" %} {% block title %}Novo Empréstimo{% endblock %}
{% block content %}

<div class="novo-usuario-container">
  <div class="novo-header">
    <h1>Novo Empréstimo</h1>

    <div class="novo-botoes">
      <button type="button" onclick="cancelar()" class="btn-cancelar">
        Cancelar
      </button>

      <button type="submit" form="formEmprestimo" class="btn-salvar">
        Salvar
      </button>
    </div>
  </div>

  <h3 class="secao">Dados do Livro</h3>

  <form id="formEmprestimo" data-usuario-id="{{ usuario_id }}">
    <div class="linha">
      <div class="campo grande">
        <label>Título</label>
        <input type="text" name="titulo" required />
      </div>

      <div class="campo grande">
        <label>Autor</label>
        <input type="text" name="autor" required />
      </div>
    </div>

    <div class="linha">
      <div class="campo">
        <label>Edição</label>
        <input type="text" name="edicao" />
      </div>

      <div class="campo">
        <label>Editora</label>
        <input type="text" name="editora" />
      </div>

      <div class="campo">
        <label>Local</label>
        <input type="text" name="local" />
      </div>

      <div class="campo">
        <label>Origem</label>
        <input type="text" name="origem" />
      </div>

      <div class="campo">
        <label>Ano</label>
        <input type="text" name="ano" />
      </div>
    </div>

    <div class="linha">
      <div class="campo grande">
        <label>Observação</label>
        <textarea name="observacao"></textarea>
      </div>
    </div>

    <div class="linha">
      <div class="campo">
        <label>Prazo de Devolução</label>
        <input type="date" name="prazo_devolucao" required />
      </div>
    </div>
  </form>
</div>

<script src="{{ url_for('static', filename='js/emprestimos.js') }}"></script>

{% endblock %}
