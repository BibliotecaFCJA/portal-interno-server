{% extends "base_admin.html" %} {% block title %}Novo Usuário{% endblock %} {%
block content %}

<div class="novo-usuario-container">
  <div class="novo-header">
    <h1>Novo Usuário</h1>

    <div class="novo-botoes">
      <button id="btnCancelar" class="btn-cancelar">Cancelar</button>
      <button id="btnSalvar" class="btn-salvar">Salvar</button>
    </div>
  </div>

  <h3 class="secao">Dados Pessoais</h3>

  <form id="formUsuario">
    <div class="linha">
      <div class="campo grande">
        <label>Nome Completo</label>
        <input type="text" id="nome" required />
      </div>

      <div class="campo grande">
        <label>E-mail</label>
        <input type="email" id="email" required />
      </div>
    </div>

    <div class="linha">
      <div class="campo">
        <label>Telefone</label>
        <input type="text" id="telefone" required />
      </div>

      <div class="campo">
        <label>Endereço</label>
        <input type="text" id="endereco" required />
      </div>

      <div class="campo">
        <label>Matrícula</label>
        <input type="text" id="matricula" required />
      </div>

      <div class="campo">
        <label>Tipo</label>

        <select id="tipo" required>
          <option value="">Selecione</option>
          <option value="servidor">Servidor</option>
          <option value="pesquisador">Pesquisador</option>
        </select>
      </div>

      <div class="campo">
        <label>Setor</label>
        <input type="text" id="setor" required />
      </div>
    </div>
  </form>
</div>

<script src="{{ url_for('static', filename='js/cadastro_usuario.js') }}"></script>

{% endblock %}
