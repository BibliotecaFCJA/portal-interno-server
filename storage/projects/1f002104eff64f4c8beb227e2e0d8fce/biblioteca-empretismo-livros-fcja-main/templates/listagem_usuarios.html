{% extends "base_admin.html" %} {% block title %}Listagem de Usuários{% endblock
%} {% block content %}

<div class="usuarios-container">
  <div class="usuarios-header">
    <h1>Listagem de Usuários</h1>

    <div class="usuarios-actions">
      <button id="btnCriarUsuario" class="btn-criar">Criar Usuário</button>

      <input
        type="text"
        id="pesquisaEmail"
        placeholder="Pesquisar por.."
        class="input-busca"
      />
    </div>
  </div>

  <table class="usuarios-tabela">
    <thead>
      <tr>
        <th>Nome</th>
        <th>E-mail</th>
        <th>Telefone</th>
        <th>Endereço</th>
        <th>Matricula</th>
        <th></th>
      </tr>
    </thead>

    <tbody id="tabelaUsuarios"></tbody>
  </table>

  <div class="paginacao">
    <button id="paginaAnterior" class="btn-pagina">←</button>
    <button id="proximaPagina" class="btn-pagina">→</button>
  </div>
</div>

<script src="{{ url_for('static', filename='js/usuarios.js') }}"></script>

{% endblock %}
