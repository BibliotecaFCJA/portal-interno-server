<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Acesso | Biblioteca Durmeval Trigueiro Mendes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-page">
    <main class="login-shell">
        <section class="login-intro">
            <div class="login-mark">
                <img src="{{ url_for('static', filename='img/logo_biblioteca.png') }}" alt="Logo da Biblioteca Durmeval Trigueiro Mendes">
            </div>
            <p class="eyebrow">Biblioteca institucional</p>
            <h1>Endereçamento</h1>
            <p>Um catálogo vivo para aproximar a biblioteca de pessoas, editoras e parceiros culturais.</p>
            <div class="login-rule" aria-hidden="true"></div>
            <small>Durmeval Trigueiro Mendes</small>
        </section>
        <section class="login-form-panel">
            <div class="login-form-header">
                <span class="eyebrow">Área administrativa</span>
                <h2>Boas-vindas</h2>
                <p>Entre com suas credenciais para continuar.</p>
            </div>
        {% if error %}
            <div class="alert alert-danger">{{ error }}</div>
        {% endif %}
        <form method="post" class="login-form" autocomplete="off">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Usuário</label>
            <input type="text" name="username" id="username" class="form-control" placeholder="Digite seu usuário" autocomplete="off" required autofocus>

            <label for="password">Senha</label>
            <input type="password" name="password" id="password" class="form-control" placeholder="Digite sua senha" autocomplete="new-password" required>

            <button type="submit" class="btn btn-danger w-100">Entrar no sistema <span aria-hidden="true">→</span></button>
        </form>
        </section>
    </main>
</body>
</html>
