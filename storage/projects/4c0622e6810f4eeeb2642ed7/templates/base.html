<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Endereçamento | Biblioteca Durmeval Trigueiro Mendes{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-light bg-white mb-4">
    <div class="container d-flex justify-content-between align-items-center">

        <!-- Lado esquerdo -->
        <div class="d-flex align-items-center">

            <div class="logo-container me-3">
                <img src="{{ url_for('static', filename='img/logo_biblioteca.png') }}"
                     width="70" height="70" alt="Logo Biblioteca">
            </div>

            <div>
                <div class="brand-name">
                    Biblioteca Durmeval Trigueiro Mendes
                </div>

                <small class="brand-caption">
                    Sistema de endereçamento
                </small>
            </div>

        </div>

        <!-- Lado direito -->
    </div>
</nav>	
    <main class="container mt-4">
        <nav class="section-tabs" aria-label="Cadastros">
            <a href="{{ url_for('index') }}" class="{% if request.endpoint in ['index', 'view', 'edit_instituicao', 'delete'] %}active{% endif %}"><span aria-hidden="true">▦</span> Instituições</a>
            <a href="{{ url_for('pessoas') }}" class="{% if request.endpoint in ['pessoas', 'view_pessoa', 'edit_pessoa', 'delete_pessoa'] %}active{% endif %}"><span aria-hidden="true">◎</span> Pessoas</a>
            {% if current_user.is_authenticated %}
            <a href="{{ url_for('logout') }}" class="logout-link"><span aria-hidden="true">↪</span> Sair</a>
            {% endif %}
        </nav>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer text-center mt-5">
        <small class="text-muted">© 2026 - Sistema de Gestão Biblioteca Durmeval Trigueiro Mendes</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
